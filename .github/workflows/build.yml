name: Build
on: [push, workflow_dispatch]
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          echo '{"appId":"com.ar4yc.tcoaal","appName":"TCOAAL","webDir":"www"}' > capacitor.config.json
          npx cap add ios || true
          cat <<EOF > ios/App/App/Podfile
          platform :ios, '15.0'
          use_frameworks!
          target 'App' do
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end
          EOF
          find ios -name "project.pbxproj" -exec sed -i '' 's/13.0/15.0/g' {} +
          cd ios/App/App && pod install --repo-update
          cd ../../../ && npx cap copy ios
          xcodebuild archive -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -destination 'generic/platform=iOS' -archivePath App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES
          mkdir Payload && cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r TCOAAL.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TCOAAL-IPA
          path: TCOAAL.ipa
