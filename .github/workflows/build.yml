name: Build
on: [push, workflow_dispatch]
jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          echo '{"appId":"com.ar4yc.tcoaal","appName":"TCOAAL","webDir":"www"}' > capacitor.config.json
          npx cap add ios || true
          
          # Фикс кода AppDelegate (чтобы не было ошибок Swift)
          cat <<EOF > ios/App/App/AppDelegate.swift
          import UIKit
          import Capacitor
          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool { return true }
          }
          EOF

          # Настройка Podfile
          cat <<EOF > ios/App/Podfile
          platform :ios, '15.0'
          use_frameworks!
          target 'App' do
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end
          EOF

          find ios -name "project.pbxproj" -exec sed -i '' 's/13.0/15.0/g' {} +
          cd ios/App && pod install --repo-update
          cd ../../ && npx cap copy ios
          
          # Сборка с отключением строгой проверки Swift
          xcodebuild archive -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -destination 'generic/platform=iOS' -archivePath App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES SWIFT_VERSION=5.0
          
          mkdir Payload && cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r TCOAAL.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TCOAAL-IPA
          path: TCOAAL.ipa
