name: Build Unsigned IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          # Создаем базовый конфиг программно, чтобы не тупил
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.ar4yc.tcoaal",
            "appName": "TCOAAL",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Initialize iOS Platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: List Xcode Projects (Debug)
        run: ls -R ios/App/

      - name: Build Xcode Project
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create Unsigned IPA
        run: |
          mkdir Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r TCOAAL_Unsigned.ipa Payload
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: TCOAAL_Unsigned.ipa
