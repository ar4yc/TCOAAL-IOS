name: Build Unsigned IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          echo '{"appId":"com.ar4yc.tcoaal","appName":"TCOAAL","webDir":"www"}' > capacitor.config.json

      - name: Add iOS Platform (No Sync)
        run: |
          # Флаг --no-sync запрещает запуск pod install на этом этапе
          npx cap add ios --no-sync
          
      - name: Force iOS 15.0 Target
        run: |
          # Ставим 15.0 для верности, Capacitor 7 это любит
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/g" ios/App/App/Podfile

      - name: Sync and Install Pods
        run: |
          # Теперь, когда версия исправлена, запускаем синхронизацию
          npx cap sync ios

      - name: Build Xcode Project
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create Unsigned IPA
        run: |
          mkdir Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r TCOAAL_Unsigned.ipa Payload
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: TCOAAL_Unsigned.ipa
