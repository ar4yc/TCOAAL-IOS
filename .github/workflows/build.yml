name: Build
on: [push, workflow_dispatch]
jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Set Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - run: |
          # Ставим 6-ю версию, она не капризная
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          echo '{"appId":"com.ar4yc.tcoaal","appName":"TCOAAL","webDir":"www"}' > capacitor.config.json
          npx cap add ios
          
          # Фикс версии в проекте
          find ios -name "project.pbxproj" -exec sed -i '' 's/13.0/14.0/g' {} +
          
          # Синхрон
          npx cap sync ios
          
          # Сборка без лишнего мусора
          xcodebuild archive -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -destination 'generic/platform=iOS' -archivePath App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          # Пакет
          mkdir Payload && cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r TCOAAL.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TCOAAL-IPA
          path: TCOAAL.ipa
